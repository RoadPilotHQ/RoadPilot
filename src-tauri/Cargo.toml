[package]
name = "roadpilot"
version = "0.1.0"
description = "RoadPilot desktop application"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "roadpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
futures-util = "0.3.31"
roadpilot-telemetry-client = { git = "https://github.com/RoadPilotHQ/RoadPilot-Telemetry.git", rev = "f3640b2466acbc78155ff82ee304dd872d85fafb" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
tokio = { version = "1.54.1", features = ["test-util", "rt"] }
