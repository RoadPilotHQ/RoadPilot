[package]
name = "roadpilot"
version = "0.1.0"
description = "RoadPilot desktop application"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "roadpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
roadpilot-telemetry-client = { git = "https://github.com/RoadPilotHQ/RoadPilot-Telemetry.git", rev = "98e1cbd82dd6a30c119287d66ab4b1b00f49f1f3", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
serde_json = "1.0.154"
